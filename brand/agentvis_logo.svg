<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="losblue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a416b"/>
      <stop offset="1" stop-color="#2196f3"/>
    </linearGradient>
  </defs>
  <!-- outer ring: the LineageOS cycle (two arcs, blue gradient) -->
  <g transform="rotate(115 256 256)">
    <circle cx="256" cy="256" r="190" fill="none" stroke="url(#losblue)" stroke-width="42"
            stroke-linecap="round" stroke-dasharray="447 149"/>
  </g>
  <!-- middle ring: the WD40 integration layer -->
  <circle cx="256" cy="256" r="120" fill="none" stroke="#8a939e" stroke-width="28"
          stroke-linecap="round" stroke-dasharray="565 189" transform="rotate(-90 256 256)"/>
  <!-- core: the agent -->
  <circle cx="256" cy="256" r="58" fill="#1976d2"/>
  <circle cx="256" cy="256" r="20" fill="#ffffff"/>
</svg>
